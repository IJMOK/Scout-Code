# Made by Scout Code: removes sessions from this site once their time is up,
# even if the Raspberry Pi that published them is switched off.
name: Remove expired sessions
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/expire.py
      - run: |
          git config user.name "Scout Code"
          git config user.email "scout-code@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Remove expired sessions" && git push)
