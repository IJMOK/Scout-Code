<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scout Code: Session slides</title>
<link rel="icon" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/css/app.css">
<link rel="stylesheet" href="/static/css/present.css">
</head>
<body class="present">
<div id="stage">
  <section id="slide" class="slide" aria-live="polite"></section>
</div>
<div id="blank" class="hidden"></div>
<aside id="notes" class="hidden">
  <div class="notes-head"><b>Speaker notes</b> <span class="muted" id="notes-next"></span></div>
  <div id="notes-text"></div>
</aside>
<footer id="bar">
  <span id="counter"></span>
  <span class="spacer"></span>
  <span class="keys">← → move · F full screen · N notes · W notes window · P pause AI · B blank · D dashboard</span>
</footer>
<script src="/static/js/common.js"></script>
<script src="/static/js/present.js"></script>
</body>
</html>
